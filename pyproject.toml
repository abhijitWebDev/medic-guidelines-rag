[project]
name = "rag-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "abhijitWebDev", email = "abhijitmone2@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "openai>=3.5.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "redis>=5.0.0",
    "pyyaml>=6.0.3",
    "rank-bm25>=0.2.2",
    "rich>=15.0.0",
    "tiktoken>=0.14.0",
    "uvicorn[standard]>=0.52.4",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
# Building the index from PDFs. Not needed to answer questions, and 64 MB.
ingest = ["pymupdf>=1.28.2"]

[project.scripts]
rag = "rag_project.cli:main"
rag-serve = "rag_project.api:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "httpx>=0.28.1",      # fastapi TestClient
    "pymupdf>=1.28.2",   # ingest tests
]
